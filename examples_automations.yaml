# Ejemplos de automatización

## 1. Subir backup completo cada noche

```yaml
alias: "Subir backup completo a O2 Cloud cada noche"
description: "Crea un snapshot completo y lo sube a O2 Cloud a las 3 AM"

trigger:
  - platform: time
    at: "03:00:00"

action:
  - service: hassio.snapshot_full
    data:
      name: "backup_{{ now().strftime('%Y%m%d_%H%M%S') }}"

  - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.snapshots
        to: "on"
    timeout:
      minutes: 30

  - service: o2cloud_backup.upload_backup
    data:
      file_path: "/config/backups/{{ trigger.now.strftime('backup_%Y%m%d_%H%M%S.tar') }}"

  - service: o2cloud_backup.refresh_quota

  - service: persistent_notification.create
    data:
      title: "✅ Backup a O2 Cloud"
      message: "Backup completado y subido a O2 Cloud"

mode: single
```

## 2. Verificar sesión cada semana

```yaml
alias: "Verificar sesión O2 Cloud cada semana"
description: "Prueba la conexión cada lunes y notifica si falla"

trigger:
  - platform: time
    at: "09:00:00"
    weekday:
      - mon

action:
  - service: o2cloud_backup.test_connection

  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.o2cloud_session_valid
            state: "off"
        sequence:
          - service: persistent_notification.create
            data:
              title: "⚠️ Sesión O2 Cloud expirada"
              message: "La sesión de O2 Cloud ha expirado. Reconfigura la integración."
      - default:
          - service: persistent_notification.create
            data:
              title: "✅ Sesión O2 Cloud OK"
              message: "La sesión de O2 Cloud es válida"

mode: single
```

## 3. Alerta si espacio utilizado > 80%

```yaml
alias: "Alerta de cuota O2 Cloud llena"
description: "Notifica si el uso supera el 80%"

trigger:
  - platform: numeric_state
    entity_id: sensor.o2cloud_used_percent
    above: 80

action:
  - service: persistent_notification.create
    data:
      title: "⚠️ Cuota O2 Cloud al {{ states('sensor.o2cloud_used_percent') }}%"
      message: "El almacenamiento de O2 Cloud está {{ states('sensor.o2cloud_used_percent') }}% lleno. Considera limpiar backups antiguos."

  # Opcional: enviar notificación móvil
  - service: notify.mobile_app_YOUR_DEVICE
    data:
      title: "O2 Cloud lleno"
      message: "Cuota utilizada: {{ states('sensor.o2cloud_used_percent') }}%"

mode: single
```

## 4. Subida manual desde el panel

Crear un script para facilitar subidas manuales:

```yaml
script:
  upload_ha_backup:
    alias: "Subir backup a O2 Cloud"
    description: "Sube el último backup creado a O2 Cloud"
    
    sequence:
      - service: o2cloud_backup.upload_backup
        data:
          file_path: "{{ state_attr('input_text.last_backup_path', 'value') }}"
          remote_name: "backup_{{ now().strftime('%Y%m%d_%H%M%S') }}.tar"
      
      - service: persistent_notification.create
        data:
          title: "Backup subido"
          message: "El archivo se está subiendo a O2 Cloud"
```

Y en `configuration.yaml`:

```yaml
input_text:
  last_backup_path:
    name: "Ruta del último backup"
    initial: "/config/backups/core_2024_07_06_12_30_45.tar"
```

## 5. Monitoreo avanzado: Dashboard

Crear un dashboard con sensores de O2 Cloud:

```yaml
type: vertical-stack
cards:
  - type: entities
    title: "Estado O2 Cloud"
    entities:
      - entity: binary_sensor.o2cloud_session_valid
        name: "Sesión"
      - entity: sensor.o2cloud_last_update
        name: "Última actualización"

  - type: gauge
    title: "Uso de almacenamiento"
    entity: sensor.o2cloud_used_percent
    min: 0
    max: 100
    needle: true
    segments:
      - from: 0
        color: "#00ff00"
      - from: 70
        color: "#ffff00"
      - from: 85
        color: "#ff0000"

  - type: custom:bar-card
    title: "Espacio usado"
    entity_row: true
    entities:
      - entity: sensor.o2cloud_used_bytes
        name: "Usado"
        color: "#ff9800"
      - entity: sensor.o2cloud_free_bytes
        name: "Libre"
        color: "#4caf50"

  - type: button
    name: "Actualizar cuota"
    tap_action:
      action: call-service
      service: o2cloud_backup.refresh_quota

  - type: button
    name: "Probar conexión"
    tap_action:
      action: call-service
      service: o2cloud_backup.test_connection
```

## 6. Limpieza automática de backups antiguos

Script para mantener solo los últimos N backups:

```yaml
script:
  cleanup_old_backups:
    alias: "Limpiar backups antiguos de O2 Cloud"
    description: "Mantiene solo los últimos 10 backups en O2 Cloud"
    
    sequence:
      - service: o2cloud_backup.prune_backups
        data:
          max_backups: 10
          max_days: 90

      - service: o2cloud_backup.refresh_quota

      - service: persistent_notification.create
        data:
          title: "Limpieza completada"
          message: "Se han eliminado backups antiguos. Nueva cuota refrescada."
```

Llamar cada mes:

```yaml
alias: "Limpiar backups antiguos mensualmente"
trigger:
  - platform: time
    at: "04:00:00"
    weekday:
      - mon
action:
  - service: script.cleanup_old_backups
mode: single
```

---

**Tip**: Ajusta los tiempos, condiciones y notificaciones según tu entorno y necesidades.
